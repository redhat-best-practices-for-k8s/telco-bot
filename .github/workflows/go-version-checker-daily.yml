name: Go Version Checker - Daily Update

on:
  schedule:
    # Run daily at 6:00 AM UTC (1:00 AM EST / 2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger
permissions: read-all
jobs:
  check-go-versions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run Go version checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Make script executable
          chmod +x scripts/go-version-checker.sh
          
          # Run without --create-issues flag to only update tracking issue.
          # --check-minor also flags stale patch versions (e.g. 1.27.3 while
          # 1.27.4 is the latest stable release). Without it, repos pinned to
          # an out-of-date patch release never show up here, which is how
          # GO-2026-6859 sat unnoticed across the org until certsuite-qe's
          # govulncheck job failed.
          ./scripts/go-version-checker.sh --check-minor
      
      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-version-report
          path: scripts/caches/*.txt
          retention-days: 7

